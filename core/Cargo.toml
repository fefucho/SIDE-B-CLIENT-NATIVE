[workspace]
resolver = "2"
members = [
    "crates/innertube",
    "crates/listen-protocol",
    "crates/sideb-core",
    "crates/player",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
listen-protocol = { path = "crates/listen-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
