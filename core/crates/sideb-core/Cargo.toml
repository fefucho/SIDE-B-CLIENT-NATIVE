[package]
name = "sideb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Side B core - Shared YouTube Music backend"

[lib]
name = "sideb_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
rustypipe-botguard = "0.1.2"
base64 = "0.22"
regex = "1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
innertube = { path = "../innertube" }
listen-protocol = { workspace = true }
md-5 = "0.10"
lofty = "0.22.2"
discord-rich-presence = "1.1.0"
uniffi = { version = "0.28", features = ["tokio", "cli"] }
