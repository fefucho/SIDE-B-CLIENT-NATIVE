name: Code sync scripts

on:
  push:
    paths:
      - 'Scripts/sync*'
      - '.github/workflows/sync.yml'
  pull_request:
    paths:
      - 'Scripts/sync*'
      - '.github/workflows/sync.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test code sync on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test Scripts/sync.test.mjs
